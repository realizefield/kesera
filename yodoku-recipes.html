<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四毒抜きレシピ帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: 台所に置く大きな文字のレシピ帳。一覧から1品を開き、人数に合わせて分量が変わる。 */
:root {
  --bg: #f3f6f1;
  --surface: #ffffff;
  --ink: #1d2823;
  --muted: #55645c;
  --line: #d5ddd4;
  --green: #2e6a4f;
  --green-ink: #ffffff;
  --green-soft: #e3eee6;
  --seal: #b3402e;
  --warn-bg: #fbf1d9;
  --warn-ink: #6b4a05;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a16; --surface: #1b2420; --ink: #e8efe9; --muted: #a3b2a9; --line: #2f3b35;
    --green: #7fc29f; --green-ink: #10201a; --green-soft: #21322a; --seal: #e0816f;
    --warn-bg: #3a2f12; --warn-ink: #f1d48a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a16; --surface: #1b2420; --ink: #e8efe9; --muted: #a3b2a9; --line: #2f3b35;
  --green: #7fc29f; --green-ink: #10201a; --green-soft: #21322a; --seal: #e0816f;
  --warn-bg: #3a2f12; --warn-ink: #f1d48a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  font-family: var(--body); font-size: 18px; line-height: 1.8;
  background: var(--bg); color: var(--ink);
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.4; }
.eyebrow { margin: 0; font-size: 15px; letter-spacing: .12em; color: var(--muted); }
.title { font-size: clamp(30px, 7vw, 42px); letter-spacing: .05em; margin-top: 4px; }
.intro { margin: 10px 0 0; color: var(--muted); }

.seals { display: flex; flex-wrap: wrap; gap: 12px; margin: 22px 0 6px; }
.seals figure { margin: 0; width: 76px; text-align: center; }
.seals figcaption { font-size: 14px; line-height: 1.4; margin-top: 4px; color: var(--muted); }
.seal { color: var(--seal); display: block; margin: 0 auto; }
.seal text { font-family: var(--display); font-weight: 700; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 14px; }
.chip {
  min-height: 48px; padding: 6px 20px; border-radius: 999px;
  border: 2px solid var(--green); background: transparent; color: var(--green); font-weight: 700;
}
.chip[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
.count { margin: 0 0 8px; font-size: 15px; color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list a { display: block; padding: 18px 20px; color: inherit; text-decoration: none; }
.list a:hover { background: var(--green-soft); }
.list .name { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.4; }
.list .sub { font-size: 15px; color: var(--muted); margin: 2px 0 0; }
.list .desc { margin: 6px 0 0; }

.back {
  min-height: 48px; padding: 6px 18px 6px 12px; border: 2px solid var(--line); background: var(--surface);
  border-radius: 8px; font-weight: 700; margin-bottom: 22px;
}
.rcat { display: inline-block; font-size: 15px; font-weight: 700; color: var(--green); border: 1.5px solid var(--green); border-radius: 999px; padding: 0 12px; line-height: 1.7; margin: 0 0 8px; }
.rtitle { font-size: clamp(28px, 6.5vw, 38px); }
.lead { margin: 10px 0 0; }
.meta { margin: 8px 0 0; color: var(--muted); font-size: 16px; }

article section { margin-top: 38px; }
article h2 { font-size: 24px; padding-bottom: 8px; border-bottom: 2px solid var(--green); margin-bottom: 14px; }

.stepper { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.stepper button {
  width: 52px; height: 52px; border-radius: 8px; border: 2px solid var(--green); background: var(--surface);
  color: var(--green); font-size: 28px; line-height: 1; font-weight: 700;
}
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 5.5em; text-align: center; font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.stepper-hint { font-size: 15px; color: var(--muted); margin: 0 0 6px; }

.ing { list-style: none; margin: 0; padding: 0; }
.ing li { border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; cursor: pointer; }
.row input { width: 26px; height: 26px; margin: 4px 0 0; accent-color: var(--green); }
.row .nm { min-width: 0; }
.row .x { display: block; font-size: 15px; color: var(--muted); line-height: 1.5; }
.row .note { display: block; margin-top: 6px; padding: 6px 10px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-ink); font-size: 15px; line-height: 1.55; }
.row .am { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row input:checked ~ .nm .t, .row input:checked ~ .am { color: var(--muted); text-decoration: line-through; }
.ghost { margin-top: 14px; min-height: 44px; padding: 4px 16px; border: 2px solid var(--line); background: transparent; border-radius: 8px; color: var(--muted); font-size: 16px; }

.steps { counter-reset: s; list-style: none; margin: 0; padding: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.steps li::before {
  content: counter(s); width: 36px; height: 36px; border-radius: 50%; background: var(--green); color: var(--green-ink);
  display: grid; place-items: center; font-weight: 700; margin-top: 2px;
}
.tips { margin: 0; padding-left: 1.3em; }
.tips li { margin-bottom: 8px; }

.check { background: var(--green-soft); border-radius: 10px; padding: 20px 18px 22px; }
article .check { margin-top: 38px; }
article .check h2 { border-bottom-color: var(--green); }
.oks { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.oks li { background: var(--surface); border: 1.5px solid var(--green); color: var(--green); font-weight: 700; border-radius: 999px; padding: 0 14px; line-height: 2; font-size: 16px; }
.buy { margin: 16px 0 0; padding: 0; list-style: none; }
.buy li { margin-top: 10px; font-size: 16px; line-height: 1.65; }
.buy strong { display: block; }
.buy-h { margin: 18px 0 0; font-weight: 700; }

.wake { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 20px; padding: 10px 14px; border-radius: 10px; background: var(--green-soft); }
.wake button { min-height: 48px; padding: 6px 18px; border-radius: 999px; border: 2px solid var(--green); background: transparent; color: var(--green); font-weight: 700; }
.wake button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
.wake p { margin: 0; flex: 1 1 14em; min-width: 0; font-size: 15px; line-height: 1.55; color: var(--muted); }

.has-bar { padding-bottom: 150px; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-btn {
  display: block; width: 100%; max-width: 720px; margin: 0 auto; min-height: 56px;
  border-radius: 10px; border: 2px solid var(--green); background: var(--green); color: var(--green-ink);
  font-weight: 700; font-size: 20px;
}

.umami-btn { display:block; width:100%; max-width:720px; margin:0 auto 8px; min-height:48px; border-radius:10px; border:2px solid var(--green); background:var(--green-soft); color:var(--green); font-weight:700; font-size:18px; }
.pop { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; }
.pop[hidden] { display:none; }
.pop-card { width:100%; max-width:560px; max-height:80vh; overflow:auto; background:var(--surface); color:var(--ink); border-radius:16px 16px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px)); }
.pop-card h2 { margin:0 0 4px; font-size:22px; }
.pop-card .pop-sub { margin:0 0 12px; color:var(--muted); font-size:15px; }
.pop-card ol { margin:0 0 16px; padding-left:1.4em; }
.pop-card li { margin-bottom:10px; line-height:1.7; }
.pop-card .pop-close { display:block; width:100%; min-height:52px; border-radius:10px; border:2px solid var(--green); background:var(--green); color:var(--green-ink); font-weight:700; font-size:18px; }
@media (min-width:700px){ .pop{align-items:center} .pop-card{border-radius:16px} }

.row.season { border-left: 6px solid var(--seal); padding-left: 10px; margin-left: -4px; }
.row.season .am { font-size: 21px; color: var(--seal); }
.row .badge { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--seal); color: #fff; font-size: 13px; font-weight: 700; vertical-align: 2px; }
.seasonbox { margin: 0 0 18px; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--seal); background: var(--surface); }
.seasonbox h3 { margin: 0 0 4px; font-size: 19px; color: var(--seal); }
.seasonbox p { margin: 0 0 8px; font-size: 15px; color: var(--muted); line-height: 1.6; }
.seasonbox ul { list-style: none; margin: 0; padding: 0; }
.seasonbox li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 20px; font-weight: 700; }
.seasonbox li span:last-child { color: var(--seal); white-space: nowrap; }

.michi-banner { display:flex; flex-direction:column; gap:2px; margin:0 0 18px; padding:14px 18px; border-radius:12px; background:var(--green); color:var(--green-ink); text-decoration:none; }
.michi-banner .mb-t { font-family:var(--display); font-weight:700; font-size:22px; }
.michi-banner .mb-s { font-size:16px; }
.flash { margin:0 0 16px; padding:14px 16px; border-radius:10px; background:var(--warn-bg); color:var(--warn-ink); font-weight:700; line-height:1.7; }
.rank { margin:0 0 18px; padding:16px; border-radius:12px; border:2px solid var(--green); background:var(--surface); text-align:center; }
.rank-l { font-size:15px; color:var(--muted); } .rank-n { font-family:var(--display); font-weight:700; font-size:28px; margin:2px 0; } .rank-p { font-size:17px; }
.stage { margin:0 0 16px; padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.stage.locked { opacity:.65; } .stage.done { border-color:var(--green); }
.stage h2 { font-size:22px; } .stage-goal { margin:6px 0; } .mission { margin:0 0 8px; font-weight:700; color:var(--green); }
.lock-note { margin:0; color:var(--muted); }
.les-list { list-style:none; margin:0; padding:0; }
.les-list li { border-top:1px solid var(--line); }
.les-list a { display:flex; gap:12px; align-items:center; padding:14px 4px; min-height:52px; color:inherit; text-decoration:none; font-size:19px; font-weight:700; }
.les-list .lk { width:28px; text-align:center; color:var(--green); font-size:22px; }
.quiz .qa { margin:0 0 18px; } .qq { font-weight:700; margin:0 0 8px; font-size:19px; }
.opt { display:block; width:100%; min-height:52px; margin:0 0 8px; padding:8px 14px; text-align:left; border-radius:10px; border:2px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px; }
.opt.ok { border-color:var(--green); background:var(--green-soft); } .opt.ng { border-color:var(--seal); }
.opt:disabled { opacity:1; }
.exp { margin:4px 0 0; font-size:16px; } .exp.ngm { color:var(--seal); font-weight:700; }
.made { margin:24px 0 0; padding:16px; border-radius:12px; border:2px dashed var(--green); text-align:center; }
.made-btn { display:block; width:100%; min-height:56px; border-radius:10px; border:2px solid var(--green); background:transparent; color:var(--green); font-weight:700; font-size:20px; }
.made-btn[aria-pressed="true"] { background:var(--green); color:var(--green-ink); }
.made-msg { margin:10px 0 0; line-height:1.7; }

.rtitle .badge { display:inline-block; margin-left:12px; padding:2px 12px; border-radius:999px; background:var(--seal); color:#fff; font-family:var(--body); font-size:15px; font-weight:700; vertical-align:middle; }
.hi-banner { background:var(--green-soft); color:var(--green); border:2px solid var(--green); margin-top:-6px; }
.lv { display:inline-block; padding:0 10px; border-radius:999px; font-weight:700; font-size:14px; border:2px solid var(--green); color:var(--green); }
.lv-中級 { background:var(--green-soft); } .lv-上級 { background:var(--green); color:var(--green-ink); }
.hi-h { font-size:21px; margin:20px 0 8px; }
.hi-list { list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.hi-list li + li { border-top:1px solid var(--line); }
.hi-list a { display:block; padding:14px 18px; color:inherit; text-decoration:none; min-height:52px; }
.hi-list .hn { display:block; font-family:var(--display); font-weight:700; font-size:22px; }
.hi-list .hs { display:block; font-size:15px; color:var(--muted); }
.thanks { margin:16px 0; padding:14px 16px; border-radius:10px; background:var(--green-soft); line-height:1.8; font-weight:700; }
.hito { margin:24px 0 0; padding:16px; border-radius:12px; background:var(--surface); border:1px solid var(--line); }
.hito p { margin:4px 0; }
.hito-links { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
.hito-links a { padding:8px 16px; min-height:44px; display:inline-flex; align-items:center; border-radius:999px; border:2px solid var(--green); color:var(--green); font-weight:700; text-decoration:none; }
.rec { margin:6px 0; line-height:1.9; font-size:16px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:0 0 18px; }
.tiles a { display:flex; flex-direction:column; gap:2px; padding:12px 14px; min-height:68px; border-radius:12px; background:var(--green); color:var(--green-ink); text-decoration:none; }
.tiles a:nth-child(2) { background:var(--green-soft); color:var(--green); border:2px solid var(--green); }
.tiles a:nth-child(3) { background:var(--surface); color:var(--green); border:2px solid var(--line); }
.tiles b { font-family:var(--display); font-size:19px; } .tiles span { font-size:14px; }
.progress { margin:0 0 18px; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.progress h2 { font-size:20px; margin-bottom:8px; }
.prow { margin:0 0 12px; } .pl { display:flex; justify-content:space-between; font-size:18px; font-weight:700; } .pl strong { color:var(--green); font-size:22px; }
.pbar { height:14px; border-radius:999px; background:var(--green-soft); overflow:hidden; margin:4px 0; } .pbar div { height:100%; background:var(--green); border-radius:999px; }
.prow.base .pbar div { background:var(--seal); } .prow.base .pl strong { color:var(--seal); }
.pn { font-size:14px; color:var(--muted); }
.flabel { margin:16px 0 6px; font-weight:700; font-size:18px; text-align:left; }
.made { text-align:left; }
.rates, .saves { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.rate, .save { min-height:60px; padding:6px 4px; border-radius:10px; border:2px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; font-weight:700; line-height:1.3; }
.rate span { display:block; font-size:26px; }
.rate[aria-pressed="true"], .save[aria-pressed="true"] { border-color:var(--green); background:var(--green); color:var(--green-ink); }
.fstep { display:flex; align-items:center; justify-content:center; gap:14px; }
.fstep button { width:56px; height:56px; border-radius:50%; border:2px solid var(--green); background:var(--surface); color:var(--green); font-size:28px; font-weight:700; }
.fstep output { min-width:5.5em; text-align:center; font-size:22px; font-weight:700; }
.packrow { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-top:12px; } .pk { display:block; text-align:center; font-weight:700; margin-bottom:4px; }
.fhint { margin:8px 0 0; text-align:center; color:var(--muted); }
#logMemo, #expText { width:100%; box-sizing:border-box; padding:10px; border-radius:10px; border:2px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:17px; margin-bottom:12px; }
.hist-h { font-size:19px; margin:20px 0 6px; }
.hist { list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
.hist li { padding:12px 14px; border-top:1px solid var(--line); } .hist li:first-child { border-top:0; }
.hist .h1 { display:flex; justify-content:space-between; gap:8px; font-weight:700; } .hist .ht { font-family:var(--display); font-size:20px; font-weight:700; } .hist .ht a { color:inherit; }
.hist .h2, .hist .h3 { font-size:16px; margin-top:2px; } .hist .h3 { color:var(--muted); }
.hdel { margin-top:8px; min-height:40px; padding:2px 14px; border-radius:8px; border:2px solid var(--line); background:transparent; color:var(--muted); font-size:15px; }
.kesera { margin:24px 0 0; padding:16px; border-radius:12px; border:2px solid var(--seal); background:var(--surface); }
.krow { display:grid; gap:10px; } .klink { text-align:center; text-decoration:none; line-height:56px; background:var(--green); color:var(--green-ink); box-sizing:border-box; }
#petals { position:fixed; inset:0; z-index:40; pointer-events:none; overflow:hidden; }
#petals i { position:absolute; top:-30px; border-radius:150% 0 150% 0; opacity:.9; animation:petal linear forwards; }
@keyframes petal { 0% { transform:translate(0,0) rotate(0deg); opacity:0; } 8% { opacity:.95; } 100% { transform:translate(var(--sw), 110vh) rotate(var(--rot)); opacity:.85; } }
.dalt { margin:0 0 20px; padding:12px 16px; border-radius:12px; border:2px solid var(--green); background:var(--green-soft); }
.dalt summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:700; font-size:19px; color:var(--green); }
.dalt ol { margin:8px 0; padding-left:0; list-style:none; } .dalt li { margin:0 0 12px; padding:10px 12px; border-radius:8px; background:var(--surface); line-height:1.7; }
.dalt .drec { margin:6px 0; padding:10px 12px; border-radius:8px; background:var(--surface); border-left:6px solid var(--green); font-weight:700; line-height:1.7; }
.dalt .dnote { margin:0; padding:8px 10px; border-radius:6px; background:var(--warn-bg); color:var(--warn-ink); font-size:15px; }
.row .dh { color:var(--green); font-weight:700; }
.fromk { margin:0 0 12px; } .fromk a { display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:999px; border:2px solid var(--seal); color:var(--seal); font-weight:700; text-decoration:none; }
.tiles a:nth-child(4) { background:var(--surface); color:var(--green); border:2px solid var(--green); }
.dnote2 { margin:0 0 14px; padding:10px 14px; border-radius:8px; background:var(--warn-bg); color:var(--warn-ink); font-size:15px; line-height:1.7; }
.dg { margin:0 0 8px; border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:hidden; }
.dg summary { display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:56px; padding:8px 16px; cursor:pointer; }
.dg .dn { font-family:var(--display); font-weight:700; font-size:20px; }
.dg .dl { flex:none; padding:1px 10px; border-radius:999px; border:2px solid var(--green); color:var(--green); font-size:13px; font-weight:700; white-space:nowrap; }
.dg .dl.lvl-6 { background:var(--green); color:var(--green-ink); }
.dgb { padding:4px 16px 16px; line-height:1.8; } .dgb p { margin:8px 0; }
.mech { padding:10px 12px; border-radius:8px; background:var(--green-soft); }
.amz { display:flex; align-items:center; justify-content:center; min-height:52px; border-radius:10px; background:var(--green); color:var(--green-ink); font-weight:700; font-size:18px; text-decoration:none; }
.vids { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }
.vlink {
  display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center;
  min-height: 56px; padding: 10px 16px 10px 12px; border-radius: 10px;

function fmt(ing, k) {
  if (ing.a == null) return ing.t || '';
  var v = ing.a * k, u = ing.u;
  if (u === 'g' || u === 'ml') {
    v = v >= 50 ? Math.round(v / 5) * 5 : Math.round(v);
    return v + u;
  }
  var spoon = (u === '大さじ' || u === '小さじ');
  var s = spoon ? 0.25 : 0.5;
  var r = Math.round(v / s) * s;
  if (r < s) r = s;
  var w = Math.floor(r + 1e-9);
  var f = ['', '1/4', '1/2', '3/4'][Math.round((r - w) * 4)];
  var t = w ? (f ? w + 'と' + f : String(w)) : f;
  return spoon ? u + t : t + u;
}

// 調理中に画面が消えないようにします（画面をつけたままにする機能）。
var wake = null, wakeWanted = true, wakePending = false;

function updateWakeUI() {
  var btn = document.getElementById('wakeBtn'), msg = document.getElementById('wakeMsg');
  if (!btn || !msg) return;
  btn.setAttribute('aria-pressed', String(wakeWanted));
  btn.textContent = '画面をつけたまま：' + (wakeWanted ? 'オン' : 'オフ');
  var later = '端末の設定で、画面の自動ロックを長めにする方法もあります。';
  if (!wakeWanted) msg.textContent = '画面は、端末の設定どおりに消えます。';
  else if (wake) msg.textContent = '調理中は、画面をつけたままにしています。';
  else if (wakePending) msg.textContent = '設定しています。';
  else if (!('wakeLock' in navigator)) msg.textContent = 'この端末では、この機能を使えません。' + later;
  else msg.textContent = '画面をつけたままにできませんでした。ボタンを押して、もう一度お試しください。' + later;
}

async function requestWake() {
  if (!wakeWanted || wake || wakePending || !currentRecipe()) { updateWakeUI(); return; }
  if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') { updateWakeUI(); return; }
  wakePending = true;
  updateWakeUI();
  try {
    wake = await navigator.wakeLock.request('screen');
    wake.addEventListener('release', function () { wake = null; updateWakeUI(); });
  } catch (e) { wake = null; }
  wakePending = false;
  if (wake && (!currentRecipe() || !wakeWanted)) releaseWake();
  updateWakeUI();
}

function releaseWake() {
  var w = wake;
  wake = null;
  if (w) { try { w.release().catch(function () {}); } catch (e) {} }
  updateWakeUI();
}

function answer(lessonId, qi, oi) {
  var L = LESSONS[lessonId];
  if (prog.les[lessonId]) return;
  var st = qs[lessonId] || (qs[lessonId] = {});
  if (st[qi] && st[qi].ok) return;
  st[qi] = { chosen: oi, ok: oi === L.q[qi].a };
  flash = '';
  var allOk = L.q.every(function (q, i) { return st[i] && st[i].ok; });
  if (allOk) {
    var before = clearedCount();
    prog.les[lessonId] = 1;
    saveProg();
    flash = '🎉 合格です！　+' + PT_LESSON + 'pt';
    var cm = clearMsg(before);
    if (cm) flash += '<br>' + cm;
    else {
      var s = STAGES.filter(function (x) { return x.lessons.indexOf(lessonId) >= 0; })[0];
      if (stageLessonsDone(s) === s.lessons.length && madeCount() < s.need) flash += '<br>学ぶ課題は終わりました。あと ' + (s.need - madeCount()) + '品 作ると、クリアです。';
    }
  }
  renderLesson(lessonId);
  if (prog.les[lessonId] && allOk) confetti(flash.indexOf('🏆') >= 0);
}

function confetti(big) {
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var old = document.getElementById('petals'); if (old && old.parentNode) old.parentNode.removeChild(old);

    var cols = ['#f7b6c8', '#f29bb5', '#fbd0dc', '#ffffff', '#f4a6bd'];
    var n = big ? 90 : 45, html = '';
    for (var i = 0; i < n; i++) {
      var sz = 10 + Math.random() * 12, left = Math.random() * 100, dur = 3 + Math.random() * 3, del = Math.random() * (big ? 1.8 : 1), sw = (Math.random() * 120 - 60).toFixed(0), rot = (Math.random() * 720 - 360).toFixed(0);
      html += '<i style="left:' + left.toFixed(1) + '%;width:' + sz.toFixed(0) + 'px;height:' + (sz * 0.8).toFixed(0) + 'px;background:' + cols[i % cols.length] +
        ';animation-duration:' + dur.toFixed(1) + 's;animation-delay:' + del.toFixed(2) + 's;--sw:' + sw + 'px;--rot:' + rot + 'deg"></i>';
    }
    box.innerHTML = html;
    document.body.appendChild(box);
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 7500);
  } catch (e) {}
}

function stepper(act, val, unit, label) {
  return '<div class="fstep" role="group" aria-label="' + label + '"><button type="button" data-act="' + act + '" data-d="-1" aria-label="' + label + 'を減らす">−</button><output>' + val + unit + '</output><button type="button" data-act="' + act + '" data-d="1" aria-label="' + label + 'を増やす">＋</button></div>';
}

function logSection() {
  return '<section class="made"><h2>作りましたか？　記録しましょう</h2><div id="logbox"></div></section>';
}

function paintLog(r) {
  var box = document.getElementById('logbox');
  if (!box) return;
  var f = form;
  var keep = document.getElementById('logMemo');
  if (keep) f.memo = keep.value || '';
  var mine = [];
  prog.log.forEach(function (e, i) { if (e.id === r.id) mine.push({ e: e, i: i }); });
  box.innerHTML =
    '<p class="flabel">①　今日の出来は？</p><div class="rates">' +
      Object.keys(RATES).map(function (k) {
        return '<button type="button" class="rate" data-act="rate" data-v="' + k + '" aria-pressed="' + (f.rate === k) + '"><span>' + RATES[k].icon + '</span>' + RATES[k].label + '</button>';
      }).join('') + '</div>' +
    '<p class="flabel">②　何人分、作りましたか？</p>' + stepper('fsize', f.size, '人分', '作った量') +
    '<p class="flabel">③　パックして保存しますか？</p><div class="saves">' +
      [['none', '保存しない'], ['fridge', '冷蔵'], ['freezer', '冷凍']].map(function (x) {
        return '<button type="button" class="save" data-act="fsave" data-v="' + x[0] + '" aria-pressed="' + (f.save === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
    (f.save !== 'none'
      ? '<div class="packrow"><div><span class="pk">パックの数</span>' + stepper('fpack', f.packs, 'パック', 'パックの数') + '</div>' +
        '<div><span class="pk">1パックの量</span>' + stepper('fper', f.per, '人分', '1パックの量') + '</div></div>' +
        '<p class="fhint">パックの合計は ' + (f.packs * f.per) + '人分です。' + (f.packs * f.per > f.size ? '作った量より多くなっています。' : '') + '</p>'
      : '') +
    '<p class="flabel">④　ひとことメモ（なくても大丈夫です）</p>' +
    '<textarea id="logMemo" rows="2" maxlength="120" placeholder="例：しょうゆを少し減らした。家族に好評。">' + f.memo.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</textarea>' +
    '<button type="button" class="made-btn" data-act="logsave">📒 記録する（+' + PT_MADE + 'pt）</button>' +
    '<p class="made-msg" id="madeMsg" aria-live="polite">' + (f.msg || '') + '</p>' +
    (mine.length ? '<h3 class="hist-h">このレシピの記録（' + mine.length + '回）</h3><ul class="hist">' + mine.slice().reverse().map(function (x) { return histItem(x.e, x.i, false); }).join('') + '</ul>' : '') +
    '<p class="made-msg"><a href="#note">料理ノートを見る</a>　／　<a href="#michi">料理への道を見る</a></p>';
}

function histItem(e, i, withTitle) {
  var rt = RATES[e.rate] || RATES.normal;
  var r = recipeById(e.id);
  return '<li><div class="h1"><span>' + e.d + '</span><span class="hr">' + rt.icon + ' ' + rt.label + '</span></div>' +
    (withTitle ? '<div class="ht"><a href="#' + e.id + '">' + (r ? r.title : e.id) + '</a></div>' : '') +
    '<div class="h2">' + e.size + '人分を作りました。　' + saveText(e) + '</div>' +
    (e.memo ? '<div class="h3">メモ：' + e.memo.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>' : '') +
    '<button type="button" class="hdel" data-act="logdel" data-i="' + i + '">' + (pendingDel === i ? '本当に消す' : '消す') + '</button></li>';
}

function saveLog(r) {
  var f = form;
  if (!f.rate) { f.msg = '「今日の出来」を選んでください。'; paintLog(r); return; }
  var keep = document.getElementById('logMemo'); if (keep) f.memo = keep.value || '';
  var before = clearedCount();
  var first = !prog.made[r.id];
  prog.log.push({ id: r.id, d: todayStr(), ts: Date.now(), rate: f.rate, size: f.size, save: f.save, packs: f.packs, per: f.per, memo: f.memo.slice(0, 120) });
  prog.made[r.id] = 1;
  saveProg();
  var cm = clearMsg(before);
  var rt = RATES[f.rate];
  f.msg = rt.icon + ' 記録しました！　' + (first ? '+' + PT_MADE + 'pt　' : '（同じ料理は2回目以降、ポイントなし）　') + rt.msg +
    (cm ? '<br><strong>' + cm + '</strong>' : '');
  f.rate = ''; f.memo = '';
  paintLog(r);
  confetti(!!cm);
}

function deleteLog(i, r) {
  if (pendingDel !== i) { pendingDel = i; return false; }
  var e = prog.log[i];
  prog.log.splice(i, 1);
  pendingDel = -1;
  if (e && !prog.log.some(function (x) { return x.id === e.id; })) delete prog.made[e.id];
  saveProg();
  return true;
}

function exportText() {
  var lines = ['【料理ノート】' + todayStr() + '時点', '作った料理 ' + madeCount() + '品／記録 ' + prog.log.length + '回'];
  ['初級', '中級', '上級'].forEach(function (lv) {
    var all = RECIPES.filter(function (r) { return r.lv === lv; });
    lines.push(lv + '：' + pct(all.filter(function (r) { return prog.made[r.id]; }).length, all.length) + '%');
  });
  lines.push('基礎知識：' + pct(Object.keys(prog.les).length, Object.keys(LESSONS).length) + '%', '');
  prog.log.forEach(function (e) {
    var r = recipeById(e.id), rt = RATES[e.rate] || RATES.normal;
    lines.push(e.d + '　' + (r ? r.title : e.id) + '　' + e.size + '人分　' + rt.label + '　' + saveText(e) + (e.memo ? '　メモ：' + e.memo : ''));
  });
  return lines.join('\n');
}

function renderNote() {
  app.className = 'wrap has-bar';
  var cnt = { great: 0, normal: 0, next: 0 };
  prog.log.forEach(function (e) { if (cnt[e.rate] != null) cnt[e.rate]++; });
  app.innerHTML =
    '<header><p class="eyebrow">挑戦した料理の記録</p><h1 class="title">料理ノート</h1>' +
    '<p class="intro">作った料理の出来、量、パック保存の記録です。</p></header>' +
    progressHtml() +
    '<div class="rank"><div class="rank-p">記録 ' + prog.log.length + '回　　😄 ' + cnt.great + '　🙂 ' + cnt.normal + '　💪 ' + cnt.next + '</div></div>' +
    '<h2 class="hi-h">これまでの記録</h2>' +
    (prog.log.length
      ? '<ul class="hist">' + prog.log.map(function (e, i) { return { e: e, i: i }; }).reverse().map(function (x) { return histItem(x.e, x.i, true); }).join('') + '</ul>'
      : '<p>まだ記録がありません。レシピの一番下で、「記録する」を押してください。</p>') +
    '<section class="kesera"><h2>ケセラとつなぐ</h2>' +
    '<p>ケセラ（毎日に、小さな楽しみを。）の「食事の記録」につなぐための、控えです。下の文字をコピーして、ケセラに貼り付けてお使いください。</p>' +
    '<textarea id="expText" rows="6" readonly></textarea>' +
    '<div class="krow"><button type="button" class="made-btn" data-act="copyexp">記録をコピーする</button>' +
    '<a class="made-btn klink" href="' + KESERA_URL + '" target="_blank" rel="noopener">ケセラを開く</a></div>' +
    '<p class="made-msg" id="copyMsg" aria-live="polite"></p></section>' +
    '<div class="bar"><button type="button" class="bar-btn" data-act="goto" data-v="list">← レシピ一覧へ</button></div>';
  var ta = document.getElementById('expText');
  if (ta) ta.value = exportText();
}

function route() {
  var id = (location.hash || '').slice(1);
  var r = RECIPES.find(function (x) { return x.id === id; });
  var lesId = id.indexOf('les-') === 0 && LESSONS[id.slice(4)] ? id.slice(4) : '';
  flash = '';
  var hiId = id.indexOf('hi-') === 0 && HITOIKI.some(function (x) { return x.id === id.slice(3); }) ? id.slice(3) : '';
  if (id === 'hitoiki' || hiId) {
    if (lastView === 'list') listScroll = window.pageYOffset || 0;
    lastView = 'detail';
    releaseWake();
    if (hiId) renderHi(hiId); else renderHitoiki();
    window.scrollTo(0, 0);
    return;
  }
  if (id === 'dougu') {
    if (lastView === 'list') listScroll = window.pageYOffset || 0;
    lastView = 'detail';
    releaseWake();
    renderDougu();
    window.scrollTo(0, 0);
    return;
  }
  if (id === 'note') {
    if (lastView === 'list') listScroll = window.pageYOffset || 0;
    lastView = 'detail';
    releaseWake();
    pendingDel = -1;
    renderNote();
    window.scrollTo(0, 0);
    return;
  }
  if (id === 'michi' || lesId) {
    if (lastView === 'list') listScroll = window.pageYOffset || 0;
    lastView = 'detail';
    releaseWake();
    if (lesId) {
      var ls = STAGES.filter(function (x) { return x.lessons.indexOf(lesId) >= 0; })[0];
      if (!stageOpen(ls)) { location.hash = 'michi'; return; }
      renderLesson(lesId);
    } else renderMichi();
    window.scrollTo(0, 0);
    return;
  }
  if (r) {
    if (lastView === 'list') listScroll = window.pageYOffset || 0;
    lastView = 'detail';
    renderDetail(r);
    requestWake();
    window.scrollTo(0, 0);
  } else {
    var fromDetail = lastView === 'detail';
    lastView = 'list';
    renderList();
    releaseWake();
    window.scrollTo(0, fromDetail ? listScroll : 0);
  }
}

function currentRecipe() {
  var id = (location.hash || '').slice(1);
  return RECIPES.find(function (x) { return x.id === id; });
}

app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act');
  if (act === 'cat') {
    cat = b.getAttribute('data-v');
    renderList();
    var again = app.querySelector('[data-act="cat"][aria-pressed="true"]');
    if (again) again.focus();
    return;
  }
  if (act === 'popopen') { var pp = document.getElementById('pop'); if (pp) { pp.hidden = false; var cb = pp.querySelector('.pop-close'); if (cb) cb.focus(); } return; }
  if (act === 'popclose') {
    if (b.classList.contains('pop') && e.target !== b) return;
    var p2 = document.getElementById('pop'); if (p2) p2.hidden = true; return;
  }
  if (act === 'back') { location.hash = 'list'; return; }
  if (act === 'goto') { location.hash = b.getAttribute('data-v'); return; }
  if (act === 'ans') {
    var lid = (location.hash || '').slice(5);
    answer(lid, +b.getAttribute('data-q'), +b.getAttribute('data-o'));
    return;
  }
  var cr = currentRecipe();
  if (act === 'rate' && cr) { form.rate = b.getAttribute('data-v'); form.msg = ''; paintLog(cr); return; }
  if (act === 'fsave' && cr) { form.save = b.getAttribute('data-v'); paintLog(cr); return; }
  if ((act === 'fsize' || act === 'fpack' || act === 'fper') && cr) {
    var dd = Number(b.getAttribute('data-d'));
    if (act === 'fsize') { form.size = Math.min(12, Math.max(1, form.size + dd)); form.touched = true; }
    if (act === 'fpack') form.packs = Math.min(12, Math.max(1, form.packs + dd));
    if (act === 'fper') form.per = Math.min(6, Math.max(1, form.per + dd));
    paintLog(cr); return;
  }
  if (act === 'logsave' && cr) { saveLog(cr); return; }
  if (act === 'logdel') {
    var di = Number(b.getAttribute('data-i'));
    var done = deleteLog(di, cr);
    if (cr) paintLog(cr); else renderNote();
    return;
  }
  if (act === 'copyexp') {
    var ta = document.getElementById('expText'), cm2 = document.getElementById('copyMsg');
    ta.value = exportText(); ta.focus(); ta.select();
    var okc = false;
    try { okc = document.execCommand && document.execCommand('copy'); } catch (er) {}
    if (!okc && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () { cm2.textContent = 'コピーしました。ケセラに貼り付けてください。'; }, function () { cm2.textContent = '文字を選んだままにしました。長押しして、コピーしてください。'; });
      return;
    }
    cm2.textContent = okc ? 'コピーしました。ケセラに貼り付けてください。' : '文字を選んだままにしました。長押しして、コピーしてください。';
    return;
  }
  if (act === 'wake') {
    wakeWanted = !wakeWanted;
    if (wakeWanted) requestWake(); else releaseWake();
    updateWakeUI();
    return;
  }
  var r = currentRecipe();
  if (!r) return;
  var n = servings[r.id] != null ? servings[r.id] : r.base;
  if (act === 'inc' && n < r.max) { servings[r.id] = n + 1; paintIng(r); if (form && !form.touched) { form.size = n + 1; paintLog(r); } }
  if (act === 'dec' && n > 1) { servings[r.id] = n - 1; paintIng(r); if (form && !form.touched) { form.size = n - 1; paintLog(r); } }
  if (act === 'clear') { saveChecks(r.id, new Set()); paintIng(r); }
});

app.addEventListener('change', function (e) {
  var box = e.target;
  if (!box.matches || !box.matches('input[data-i]')) return;
  var r = currentRecipe();
  if (!r) return;
  var set = loadChecks(r.id);
  var i = Number(box.getAttribute('data-i'));
  if (box.checked) set.add(i); else set.delete(i);
  saveChecks(r.id, set);
});
